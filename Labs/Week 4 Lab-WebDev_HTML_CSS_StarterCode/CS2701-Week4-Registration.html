<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Food For All</title>
    <link rel="stylesheet" href="CS2701-Week4-Registration.css">
</head>

<body>
    <header></header>


<nav>
    <ul class="navlist">
        <li><a href="#">Home</a></li>
        <li><a href="#">Register</a></li>
        <li><a href="#">Login</a></li>
        <li><a href="#">Help</a></li>
    </ul>
</nav>

<main>
    <aside>
        <input type="text" class="search" placeholder="Search">
    </aside>

    <section>
        <form class="center" id="registrationForm" novalidate>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email:</label><br>
            <input type="text" id="email" name="email"><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password"><br><br>

            <label for="confirmPassword">Re-type password:</label><br>
            <input type="password" id="confirmPassword" name="confirmPassword"><br><br>

            <input type="checkbox" id="buyer" name="buyer" value="buyer">
            <label for="buyer">I want to buy produce directly from allotment owners.</label><br>

            <input type="checkbox" id="seller" name="seller" value="seller">
            <label for="seller">I want to sell produce from my allotment.</label><br>

            <input type="checkbox" id="terms" name="terms" value="accepted">
            <label for="terms">I agree to the Terms of Use and Privacy Policy.</label><br><br>

            <button type="button" id="registerButton">Register</button>
            <a href="#">Learn more</a>
        </form>

        <div class="center" id="hiddenSection">
            <p id="hiddenParagraph"></p>
        </div>
    </section>



</body>
</html>
